# Render Blueprint (Backend + AI Service)
services:
  - type: web
    name: exam-ai-service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: ai-service
    envVars:
  - key: GEMINI_API_KEY
    sync: false
  - key: GEMINI_MODEL
    value: gemini-3.6-flash

  - type: web
    name: exam-server
    env: node
    buildCommand: npm install
    startCommand: npm start
    rootDir: server
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_SERVICE_URL
        value: https://exam-ai-service.onrender.com
      - key: CLIENT_URL
        value: https://exam-client.vercel.app
